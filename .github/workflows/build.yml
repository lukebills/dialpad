name: Build portable Dialpad
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Dialpad.app dist/Dialpad-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dialpad-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*-source.tar.gz
            dist/Dialpad/
