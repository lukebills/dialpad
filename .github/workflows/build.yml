name: Build portable Dialpad
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        name: Validate PowerShell updater
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Update-Dialpad.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - run: python build.py
      - if: runner.os == 'Windows'
        run: python scripts/smoke_windows_package.py
      - if: runner.os == 'macOS'
        run: dist/Dialpad.app/Contents/Frameworks/DialpadDesktop --cycle-queue-test
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict dist/Dialpad.app
      - run: python scripts/package_release.py
      - if: runner.os == 'Windows'
        name: Verify per-user updater
        shell: powershell
        run: ./scripts/test_windows_updater.ps1
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-window-preview
          path: build/windows-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: Dialpad-${{ runner.os }}
          path: dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Dialpad-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Dialpad $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
